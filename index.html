<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imagin.Ar</title>
    <style>
        @font-face {
            font-family: 'Pacifica Condensed';
            src: url('/assets/fonts/Pacifica Condensed Regular.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        body {
            margin: 0;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background: #000;
            color: #fff;
        }

        .topbar {
            width: 100%;
            background: #000;
            padding: 0.5em 0 0.2em 0;
            text-align: center;
            font-size: 2.7rem;
            font-weight: bold;
            letter-spacing: 2px;
            z-index: 10;
            position: relative;
            font-family: 'Pacifica Condensed', 'Helvetica Neue', Arial, sans-serif;
        }

        .divider {
            width: 33vw;
            max-width: 340px;
            height: 2px;
            background: #444;
            margin: 0.5em auto 0.5em auto;
            border-radius: 2px;
        }

        .navbar {
            width: 100%;
            background: #000;
            display: flex;
            justify-content: center;
            gap: 2.5em;
            padding: 0.7em 0 0.7em 0;
            z-index: 9;
            position: relative;
        }

        .navbar a {
            color: #fff;
            text-decoration: none;
            font-size: 1.1em;
            font-weight: bold;
            letter-spacing: 1px;
            transition: color 0.2s;
            font-family: 'Pacifica Condensed', 'Helvetica Neue', Arial, sans-serif;
            text-transform: none;
        }

        .navbar a:hover {
            color: #0080ff;
        }

        .banner {
            /* Remove width: 100vw; */
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
            margin: 0;
            padding: 0;
            margin-bottom: 12px; /* Add space below the banner */
        }

        .banner-img {
            display: block;
            max-width: 100%;
            height: auto;
            max-height: 90vh;
            min-height: 400px;
            object-fit: contain;
            background: #000;
            margin: 0 auto;
        }

        .image-grid {
            display: flex;
            margin: 0 auto; /* Remove top margin, handled by banner */
            gap: 12px; /* Space between images */
            padding: 0;
            background: #000;
        }

        .image-grid img {
            flex: 1 1 0;
            width: 0;
            height: auto;
            display: block;
            object-fit: cover;
            border-radius: 0;
            box-shadow: none;
            margin: 0;
            max-width: 100%;
        }

        @media (max-width: 600px) {
            .topbar {
                font-size: 1.3rem;
            }

            .navbar {
                gap: 1em;
                font-size: 0.9em;
            }

            .image-grid {
                padding: 0 2vw 24px 2vw;
            }

            .image-grid img {
                height: 180px;
            }

            .banner-img {
                max-height: 40vh;
                min-height: 180px;
            }

            .divider {
                width: 60vw;
            }
        }
    </style>
</head>
<body>
<div class="topbar">Imagin</div>
<div class="divider"></div>
<div class="navbar">
    <a href="https://cults3d.com/en/users/Imagin_ar/3d-models" target="_blank" rel="noopener">Cults3D</a>
    <a href="https://www.thingiverse.com/imagin_ar/designs" target="_blank" rel="noopener">Thingiverse</a>
    <a href="https://www.myminifactory.com/users/Imagin_ar" target="_blank" rel="noopener">Myminifactory</a>
</div>
<div class="banner">
    <img class="banner-img" id="mainBanner" src="/assets/images/imaginar_banner.jpg" alt="Banner">
</div>
<div class="image-grid" id="mainGrid" style="display: flex; margin: 0 auto;">
    <img id="img3" src="https://cdn.thingiverse.com/assets/eb/8d/72/1b/43/large_display_IMG_20201108_105138040.jpg"
         alt="Grid Image 3">
    <img id="img4"
         src="https://images.cults3d.com/5ry8DC-QEF2ZnKKzstn2xhQIL8g=/516x516/filters:no_upscale():format(webp)/https://fbi.cults3d.com/uploaders/17680399/illustration-file/bf2ecd99-28f6-49b5-a9f6-71c16df3d33c/bbbbb.jpg"
         alt="Grid Image 4">
</div>
<script>
    function resizeGridToBanner() {
        const banner = document.getElementById('mainBanner');
        const grid = document.getElementById('mainGrid');
        const img3 = document.getElementById('img3');
        const img4 = document.getElementById('img4');
        if (banner && grid && img3 && img4) {
            const setWidth = () => {
                const bannerWidth = banner.clientWidth;
                grid.style.width = bannerWidth + 'px';
                grid.style.margin = '0 auto';
                img3.style.width = (bannerWidth / 2) + 'px';
                img4.style.width = (bannerWidth / 2) + 'px';
                img3.style.height = 'auto';
                img4.style.height = 'auto';
            };
            if (banner.complete) {
                setWidth();
            } else {
                banner.onload = setWidth;
            }
            window.addEventListener('resize', setWidth);
        }
    }

    resizeGridToBanner();
</script>
</body>
</html>
