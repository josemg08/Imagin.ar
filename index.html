<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imagin.Ar</title>
    <style>
        @font-face {
            font-family: 'Pacifica Condensed';
            src: url('/assets/fonts/Pacifica Condensed Regular.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        body {
            margin: 0;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background: #000;
            color: #fff;
        }

        .topbar {
            width: 100%;
            background: #000;
            padding: 0.5em 0 0.2em 0;
            text-align: center;
            font-size: 2.7rem;
            font-weight: bold;
            letter-spacing: 2px;
            z-index: 10;
            position: relative;
            font-family: 'Pacifica Condensed', 'Helvetica Neue', Arial, sans-serif;
        }

        .divider {
            width: 33vw;
            max-width: 340px;
            height: 2px;
            background: #444;
            margin: 0.5em auto 0.5em auto;
            border-radius: 2px;
        }

        .navbar {
            width: 100%;
            background: #000;
            display: flex;
            justify-content: center;
            gap: 2.5em;
            padding: 0.7em 0 0.7em 0;
            z-index: 9;
            position: relative;
        }

        .navbar a {
            color: #fff;
            text-decoration: none;
            font-size: 1.1em;
            font-weight: bold;
            letter-spacing: 1px;
            transition: color 0.2s;
            font-family: 'Pacifica Condensed', 'Helvetica Neue', Arial, sans-serif;
            text-transform: none;
        }

        .navbar a:hover {
            color: #0080ff;
        }

        .banner {
            /* Remove width: 100vw; */
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
            margin: 0;
            padding: 0;
            margin-bottom: 12px; /* Add space below the banner */
        }

        .banner-img {
            display: block;
            max-width: 100%;
            height: auto;
            max-height: 90vh;
            min-height: 400px;
            object-fit: contain;
            background: #000;
            margin: 0 auto;
        }

        .image-grid {
            width: 100%;
            max-width: 100%;
            margin: 0 auto;
            background: #000;
            padding: 0 4px; /* Reduced padding */
            margin-left: 33px; /* Adjust this value to control the left margin of the entire grid */
            box-sizing: border-box;
        }

        .grid-item {
            box-sizing: border-box;
            width: 23%; /* Slightly increased to fill the reduced margin space */
            margin: 0 0 2px 0.05%; /* Reduced margins between items */
        }

        .grid-item img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: cover;
        }

        @media (max-width: 600px) {
            .topbar {
                font-size: 1.3rem;
            }

            .navbar {
                gap: 1em;
                font-size: 0.9em;
            }

            .image-grid {
                padding: 0 6px;
            }

            .grid-item {
                width: 46%; /* Slightly smaller for mobile */
                margin: 0 2% 12px 2%;
            }

            .image-grid img {
                height: 180px;
            }

            .banner-img {
                max-height: 40vh;
                min-height: 180px;
            }

            .divider {
                width: 60vw;
            }
        }
    </style>
    <script src="https://unpkg.com/masonry-layout@4.2.2/dist/masonry.pkgd.min.js"></script>
    <script src="https://unpkg.com/imagesloaded@5/imagesloaded.pkgd.min.js"></script>
</head>
<body>
<div class="topbar">Imagin</div>
<div class="divider"></div>
<div class="navbar">
    <a href="https://cults3d.com/en/users/Imagin_ar/3d-models" target="_blank" rel="noopener">Cults3D</a>
    <a href="https://www.thingiverse.com/imagin_ar/designs" target="_blank" rel="noopener">Thingiverse</a>
    <a href="https://www.myminifactory.com/users/Imagin_ar" target="_blank" rel="noopener">Myminifactory</a>
</div>
<div class="banner">
    <img class="banner-img" id="mainBanner" src="/assets/images/imaginar_banner.jpg" alt="Banner">
</div>
<div class="image-grid" id="mainGrid">
    <div class="grid-item">
        <img src="https://cdn.thingiverse.com/assets/f6/90/02/36/af/large_display_heraldryClean.png" alt="Grid Image 0">
    </div>
    <div class="grid-item">
        <img src="https://cdn.thingiverse.com/assets/22/4c/d8/f6/b8/large_display_IMG_20220408_121034_2.jpg" alt="Grid Image 1">
    </div>
    <div class="grid-item">
        <img src="https://fbi.cults3d.com/uploaders/17680399/illustration-file/c2970213-af9a-4494-b5e7-84a461eb3e3a/lkjlkljkl.png" alt="Grid Image 2">
    </div>
    <div class="grid-item">
        <img src="https://cdn.thingiverse.com/assets/eb/8d/72/1b/43/large_display_IMG_20201108_105138040.jpg" alt="Grid Image 3">
    </div>
    <div class="grid-item">
        <img src="https://images.cults3d.com/5ry8DC-QEF2ZnKKzstn2xhQIL8g=/516x516/filters:no_upscale():format(webp)/https://fbi.cults3d.com/uploaders/17680399/illustration-file/bf2ecd99-28f6-49b5-a9f6-71c16df3d33c/bbbbb.jpg" alt="Grid Image 4">
    </div>
    <div class="grid-item">
        <img src="https://images.cults3d.com/IcL6kRLS5PxKApdMm9lDXSCAUP4=/516x516/filters:no_upscale():format(webp)/https://fbi.cults3d.com/uploaders/17680399/illustration-file/b6c7804f-0627-4c47-bb5b-86364b28cce6/_90f516b6-d61d-4b1d-ad51-5e8a84536614.jpg" alt="Grid Image 5">
    </div>
</div>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        const grid = document.querySelector('.image-grid');
        const msnry = new Masonry(grid, {
            itemSelector: '.grid-item',
            columnWidth: '.grid-item',
            percentPosition: true,
            gutter: 12
        });

        // Update Masonry layout after images are loaded
        imagesLoaded(grid).on('progress', function() {
            msnry.layout();
        });

        // Remove the banner width constraint
        window.addEventListener('resize', function() {
            msnry.layout();
        });
    });
</script>
</body>
</html>
