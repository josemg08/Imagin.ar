        @font-face {
            font-family: 'Pacifica Condensed';
            src: url('/assets/fonts/Pacifica Condensed Regular.ttf') format('truetype');
            font-weight: normal;

        }

        body {
            margin: 0;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background: #000;
            color: #fff;
        }

        .topbar {
            width: 100%;
            background: #000;
            padding: 0.5em 0 0.2em 0;
            text-align: center;
            font-size: 2.7rem;
            font-weight: bold;
            letter-spacing: 2px;
            z-index: 10;
            position: relative;
            font-family: 'Pacifica Condensed', 'Helvetica Neue', Arial, sans-serif;
        }

        .divider {
            width: 33vw;
            max-width: 340px;
            height: 2px;
            background: #444;
            margin: 0.5em auto 0.5em auto;
            border-radius: 2px;
        }

        .navbar {
            width: 100%;
            background: #000;
            display: flex;
            justify-content: center;
            gap: 2.5em;
            padding: 0.7em 0 0.7em 0;
            z-index: 9;
            position: relative;
        }

        .navbar a {
            color: #fff;
            text-decoration: none;
            font-size: 1.1em;
            font-weight: bold;
            letter-spacing: 1px;
            transition: color 0.2s;
            font-family: 'Pacifica Condensed', 'Helvetica Neue', Arial, sans-serif;
            text-transform: none;
        }

        .navbar a:hover {
            color: #0080ff;
        }

        .banner {
            /* Remove width: 100vw; */
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
            margin: 0;
            padding: 0;
            margin-bottom: 12px; /* Add space below the banner */
        }

        .banner-img {
            display: block;
            max-width: 100%;
            height: auto;
            max-height: 90vh;
            min-height: 400px;
            object-fit: contain;
            background: #000;
            margin: 0 auto;
        }

        .image-grid {
            width: 100%;
            max-width: 100%;
            margin: 0 auto;
            padding: 10px;
            position: relative;
        }

        .grid-item {
            width: calc(33.333% - 20px);
            margin: 10px;
            display: block;
            opacity: 1; /* Changed from 0 to 1 */
            transition: transform 0.3s ease;
            background: #111; /* Added for better visibility */
            position: relative;
        }

        .grid-item img {
            width: 100%;
            height: 100%;
            display: block;
            border-radius: 8px;
            object-fit: cover; /* Changed from auto to cover */
            min-height: 200px; /* Added minimum height */
            transition: transform 0.3s ease;
            background: #111; /* Added for better visibility while loading */
        }

        .grid-item img:hover {
            transform: scale(1.02);
        }

        @media screen and (min-width: 1200px) {
            .grid-item {
                width: calc(25% - 20px);
            }
        }

        @media screen and (max-width: 768px) {
            .grid-item {
                width: calc(50% - 16px);
                margin: 8px;
            }
            .image-grid {
                padding: 8px;
            }
        }

        @media screen and (max-width: 480px) {
            .grid-item {
                width: calc(50% - 8px);
                margin: 4px;
            }
            .image-grid {
                padding: 4px;
            }
            .grid-item img {
                min-height: 150px;
            }
        }

        @media (max-width: 600px) {
            .topbar {
                font-size: 1.3rem;
            }

            .navbar {
                gap: 1em;
                font-size: 0.9em;
            }

            .image-grid {
                padding: 0 6px;
            }

            .grid-item {
                width: 46%; /* Slightly smaller for mobile */
                margin: 0 2% 12px 2%;
            }

            .image-grid img {
                height: 180px;
            }

            .banner-img {
                max-height: 40vh;
                min-height: 180px;
            }

            .divider {
                width: 60vw;
            }
        }
    </style>

</head>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const grid = document.querySelector('.image-grid');

        // Initialize Masonry with proper configuration
        const msnry = new Masonry(grid, {
            itemSelector: '.grid-item',
            percentPosition: true,
            gutter: 20,
            columnWidth: '.grid-item',
            transitionDuration: '0.3s',
            fitWidth: true,
            initLayout: false
        });

        // Function to set dynamic heights for larger screens
        function setImageHeights() {
            const heights = ['250px', '300px', '350px', '400px'];
            if (window.innerWidth > 768) {
                document.querySelectorAll('.grid-item').forEach(item => {
                    const randomHeight = heights[Math.floor(Math.random() * heights.length)];
                    const img = item.querySelector('img');
                    if (img) {
                        img.style.height = randomHeight;
                        img.style.objectFit = 'cover';
                    }
                });
            } else {
                // Reset heights for mobile view
                document.querySelectorAll('.grid-item img').forEach(img => {
                    img.style.height = '200px';
                    img.style.objectFit = 'cover';
                });
            }
            msnry.layout();
        }

        // Use imagesLoaded to handle image loading
        imagesLoaded(grid, function() {
            setImageHeights();
            msnry.layout();

            // Fade in images after layout
            document.querySelectorAll('.grid-item').forEach(item => {
                item.style.opacity = '1';
            });
        });

        // Handle window resize
        let resizeTimeout;
        window.addEventListener('resize', function() {
            clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(function() {
                setImageHeights();
            }, 250);
        });

        // Handle images that fail to load
        document.querySelectorAll('.grid-item img').forEach(img => {
            img.addEventListener('error', function() {
                this.style.display = 'none';
                msnry.layout();
            });
        });
    });
</script>
