<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imagin.Ar</title>
    <style>
        @font-face {
            font-family: 'Pacifica Condensed';
            src: url('/assets/fonts/Pacifica Condensed Regular.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        body {
            margin: 0;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background: #000;
            color: #fff;
        }

        .topbar {
            width: 100%;
            background: #000;
            padding: 0.5em 0 0.2em 0;
            text-align: center;
            font-size: 2.7rem;
            font-weight: bold;
            letter-spacing: 2px;
            z-index: 10;
            position: relative;
            font-family: 'Pacifica Condensed', 'Helvetica Neue', Arial, sans-serif;
        }

        .divider {
            width: 33vw;
            max-width: 340px;
            height: 2px;
            background: #444;
            margin: 0.5em auto 0.5em auto;
            border-radius: 2px;
        }

        .navbar {
            width: 100%;
            background: #000;
            display: flex;
            justify-content: center;
            gap: 2.5em;
            padding: 0.7em 0 0.7em 0;
            z-index: 9;
            position: relative;
        }

        .navbar a {
            color: #fff;
            text-decoration: none;
            font-size: 1.1em;
            font-weight: 500;
            letter-spacing: 1px;
            transition: color 0.2s;
        }

        .navbar a:hover {
            color: #ffd700;
        }

        .banner {
            width: 100vw;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
            margin: 0;
            padding: 0;
        }

        .banner-img {
            width: 100vw;
            max-width: 100vw;
            height: auto;
            max-height: 90vh;
            min-height: 400px;
            display: block;
            object-fit: contain;
            background: #000;
            margin: 0 auto;
        }

        .image-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 24px;
            padding: 0 5vw 48px 5vw;
            z-index: 3;
            position: relative;
            background: #000;
            margin-top: 0;
        }

        .image-grid img {
            width: 100%;
            height: 320px;
            object-fit: cover;
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.18);
            transition: transform 0.2s;
        }

        .image-grid img:hover {
            transform: scale(1.03);
        }

        @media (max-width: 600px) {
            .topbar {
                font-size: 1.3rem;
            }

            .navbar {
                gap: 1em;
                font-size: 0.9em;
            }

            .image-grid {
                padding: 0 2vw 24px 2vw;
            }

            .image-grid img {
                height: 180px;
            }

            .banner-img {
                max-height: 40vh;
                min-height: 180px;
            }

            .divider {
                width: 60vw;
            }
        }
    </style>
</head>
<body>
<div class="topbar">Imagin</div>
<div class="divider"></div>
<div class="navbar">
    <a href="/home">Home</a>
    <a href="/gallery">Gallery</a>
    <a href="/about">About</a>
</div>
<div class="banner">
    <img class="banner-img" src="/assets/images/imaginar_banner.jpg" alt="Banner">
</div>
<div class="image-grid">
    <img src="/assets/images/bio-photo.jpg" alt="Sample 1">
    <img src="/assets/images/bio-photo.jpg" alt="Sample 2">
    <img src="/assets/images/bio-photo.jpg" alt="Sample 3">
    <img src="/assets/images/bio-photo.jpg" alt="Sample 4">
    <!-- Add more images to assets/images/ and update here for a varied grid -->
</div>
</body>
</html>
